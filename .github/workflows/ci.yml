name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The npm wrapper carries the release-delivery logic (platform→asset
      # mapping, tag normalization). Run its suite so a drift fails on PR, not
      # on a release tag that's already public.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: node test.js
        working-directory: npm
      # Validate the GoReleaser config too, so a malformed v2 key is caught
      # before the tag push (not after the tag is already public).
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: check

  # Exercise the real npm install path (npm pack → global install → postinstall
  # download, checksum verification, tar/zip extraction, bin shim → `tacho
  # version`) on every supported OS, since the extraction tooling differs (GNU
  # tar on Linux, bsdtar on macOS/Windows) and the test job only covers ubuntu.
  # Installs the release matching npm/package.json's version, so on a
  # release-prep PR (version bumped, tag not pushed yet) it skips instead of
  # failing on a download that cannot exist yet.
  npm-smoke:
    strategy:
      # Keep the other OSes running when one fails: the OS-specific extraction
      # differences are exactly what this job exists to diagnose.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Check whether this version's release exists
        id: release
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="https://github.com/kosako/tachograph/releases/download/v${version}/checksums.txt"
          # Only an explicit 404 means "not published yet"; DNS/TLS failures
          # abort via the command substitution's exit code, and any other
          # status fails the job rather than silently skipping the smoke.
          code="$(curl -sSLI -o /dev/null -w '%{http_code}' "$url")"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "::notice::release v${version} not published yet (release-prep PR?); skipping npm install smoke"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected HTTP ${code} checking ${url}"
            exit 1
          fi
      - name: Pack and install the wrapper globally
        if: steps.release.outputs.exists == 'true'
        working-directory: npm
        run: |
          npm pack
          npm install -g "./tachograph-${{ steps.release.outputs.version }}.tgz"
      - name: Run the installed binary
        if: steps.release.outputs.exists == 'true'
        run: |
          out="$(tacho version)"
          echo "$out"
          test "$out" = "tacho v${{ steps.release.outputs.version }}"
