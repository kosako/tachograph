name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository, so pin GITHUB_TOKEN to read here rather
# than inherit the repository's default workflow permissions (#341). The
# checkouts also drop the token afterwards (persist-credentials: false): no
# step pushes or fetches with it, and the jobs go on to run repo scripts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Above go test's default -timeout (10m), so a hung test fails with its
    # own name and stack before the job is cancelled (#432).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fail when a Go file isn't gofmt'd (#390), naming the files and showing
      # the diff that gofmt -w applies. Only in this job: formatting doesn't
      # depend on the OS, and a Windows checkout may turn line endings to CRLF.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'd; run gofmt -w on these files:"
            printf '%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The npm wrapper carries the release-delivery logic (platform→asset
      # mapping, tag normalization). Run its suite so a drift fails on PR, not
      # on a release tag that's already public — on the oldest Node that
      # npm/package.json's engines accepts (read from it, so the two can't
      # drift) as well as the current LTS, so an API newer than that floor
      # fails here, not in a user's postinstall (#382). The floor is padded to
      # N.N.N, as setup-node resolves a bare 22 to the newest 22.x rather than
      # 22.0.0, and the run checks it got exactly that version (#416).
      - name: Node floor from npm/package.json engines
        id: node-floor
        run: |
          engines="$(jq -r '.engines.node | strings' npm/package.json)"
          floor='^>=([0-9]+(\.[0-9]+){0,2})$'
          if [[ ! "$engines" =~ $floor ]]; then
            echo "::error::npm/package.json engines.node is ${engines:-not a string}; want >=N (or >=N.N, >=N.N.N) to test the floor"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          until [[ "$version" == *.*.* ]]; do version+=.0; done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-floor.outputs.version }}
      - name: node test.js on the Node floor
        run: |
          if [ "$(node --version)" != "v$NODE_FLOOR" ]; then
            echo "::error::Node is $(node --version), want exactly the floor v$NODE_FLOOR"
            exit 1
          fi
          node test.js
        working-directory: npm
        env:
          NODE_FLOOR: ${{ steps.node-floor.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: node test.js
        working-directory: npm
      # Validate the GoReleaser config too, so a malformed v2 key is caught
      # before the tag push (not after the tag is already public). Same
      # pinned version as release.yml (#351).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check

  # The whole suite on Windows (#353): the snapshot lock has its own Windows
  # implementation (LockFileEx, #330), and setup / doctor read paths, the
  # PATH, and the npm shims the Windows way, none of which the ubuntu job
  # exercises.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15 # above go test's default -timeout, as in test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Builds every release target as the release does — GoReleaser pinned as in
  # release.yml, its build flags and archives — and checks the archives the
  # npm wrapper would download (#353), so a change to .goreleaser.yaml, the
  # GoReleaser pin, or a platform-specific compile fails on the PR instead of
  # at the tag. A snapshot isn't built from a tag, so the binaries' version
  # isn't checked.
  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # GoReleaser describes the snapshot from the latest tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
      - run: go run ./scripts/check-release-assets -skip-version dist

  # Exercise the real npm install path on every supported OS (see
  # npm-install-smoke.yml) against the release matching npm/package.json's
  # version. On a release-prep PR (version bumped, tag not pushed yet) it
  # skips instead of failing on a download that cannot exist yet; release.yml
  # runs the same workflow as its gate, where a missing release fails.
  npm-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/npm-install-smoke.yml
