name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # The npm installer derives its download tag from npm/package.json's
      # version, so it must equal the pushed git tag or every `npm i` 404s.
      # Fail the release before publishing if they drift.
      - name: Verify npm/package.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./npm/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag != npm/package.json version $pkg"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: node test.js
        working-directory: npm
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the npm wrapper via trusted publishing (OIDC), so no npm token
  # exists anywhere. Must run after goreleaser: install.js downloads binaries
  # from the GitHub Release, so publishing first would make every `npm i` 404
  # until the release assets exist.
  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Trusted publishing requires npm >= 11.5.1; the runner's bundled npm
      # may be older.
      - run: npm install -g npm@11
      - run: npm publish
        working-directory: npm
