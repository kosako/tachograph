name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # The npm installer derives its download tag from npm/package.json's
      # version, so it must equal the pushed git tag or every `npm i` 404s.
      # Fail the release before publishing if they drift.
      - name: Verify npm/package.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./npm/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag != npm/package.json version $pkg"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: node test.js
        working-directory: npm
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
