name: release

# On a v* tag push, goreleaser builds and publishes the GitHub Release, then
# two gates check its assets before the npm wrapper is published (#351):
# verify-npm-install installs through the wrapper on ubuntu / macOS / Windows
# (npm-install-smoke.yml, failing when the release is missing), and
# verify-assets checks all six archives statically. npm-publish runs only
# when both pass, so a broken GitHub Release may be public for a few minutes,
# but npm is not published from it.
#
# When a run fails (also in AGENTS.md, "Release Notes"):
# - Never move or reuse a published tag: the Go module proxy caches a tag's
#   content, and moving it breaks `go install ...@vX.Y.Z`.
# - A gate failing on a transient network error: re-run the failed jobs.
# - A broken asset: delete the GitHub Release (keep the tag), fix it, and
#   release the next patch.
# - The gates passed but npm publish failed: re-run npm-publish only.
# - Once the gates pass, never delete or replace that version's assets: the
#   published npm version downloads them on every install.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # go test's default -timeout (10m) plus the build and the upload (#432).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # The npm installer derives its download tag from npm/package.json's
      # version, so it must equal the pushed git tag or every `npm i` 404s.
      # Fail the release before publishing if they drift.
      - name: Verify npm/package.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./npm/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag != npm/package.json version $pkg"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: node test.js
        working-directory: npm
      # GoReleaser is pinned (#351), as in ci.yml's check: a floating version
      # could change the archives at release time. Raise it on purpose — when
      # working on the release pipeline, or when a sweep flags it as old.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installs the new release through the npm wrapper on every OS the CI smoke
  # covers, as CI does on every PR, except that a missing release fails.
  verify-npm-install:
    needs: goreleaser
    permissions:
      contents: read
    uses: ./.github/workflows/npm-install-smoke.yml
    with:
      require-release: true

  # Checks every archive the wrapper can download, the three the install
  # can't run on included (macOS x64, Linux arm64, Windows arm64): listed in
  # checksums.txt with a matching SHA-256, the binary at the archive's top
  # level, built for its platform from this tag.
  verify-assets:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download the release's archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" --pattern 'tachograph_*' --pattern checksums.txt
      - run: go run ./scripts/check-release-assets "$RUNNER_TEMP/assets" "$GITHUB_REF_NAME"

  # Publishes the npm wrapper via trusted publishing (OIDC), so no npm token
  # exists anywhere. Runs only after both gates pass on the published GitHub
  # Release: install.js downloads binaries from it, so publishing first would
  # make every `npm i` 404 until the assets exist, and publishing over broken
  # assets would ship a wrapper that can't install.
  npm-publish:
    needs: [verify-npm-install, verify-assets]
    runs-on: ubuntu-latest
    # Short: this job holds an OIDC token (id-token: write) while it runs.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Trusted publishing requires npm >= 11.5.1; the runner's bundled npm
      # may be older. The npm that publishes is pinned, like GoReleaser: this
      # job holds the OIDC token, so a new npm release must not publish with
      # it unreviewed (#382). Raise it on purpose; 11.21.0 published v0.10.5.
      - run: npm install -g npm@11.21.0
      - run: npm publish
        working-directory: npm
